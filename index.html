<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Especial Día del Padre | Validando Registro...</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); 
            text-align: center; 
            color: #fff;
        }
        .card { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 25px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            max-width: 400px; 
            width: 90%;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-hb { max-width: 160px; height: auto; margin-bottom: 1.5rem; }
        .logo-onroad { max-width: 180px; height: auto; margin-top: 2rem; }
        
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #1e3a8a; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
        
        h1.title-dark { color: #1e3a8a; font-size: 1.8rem; margin: 10px 0; }
        p.text-dark { color: #475569; font-size: 0.95rem; }

        .code-box { 
            background: #eff6ff; 
            border: 2px dashed #1e3a8a; 
            padding: 15px; 
            border-radius: 12px; 
            margin: 15px 0; 
            font-weight: bold; 
            font-size: 1.5rem;
            color: #1d4ed8;
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 50px;
            font-weight: bold;
            display: inline-block;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s ease;
        }
        .btn-whatsapp:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="HBLOGO.jpeg" alt="HB Hoteles" class="logo-hb">
        
        <div id="loading-area">
            <div class="loader"></div>
            <h1 class="title-dark">Procesando...</h1>
            <p id="status" class="text-dark">Por favor, acepta el permiso de ubicación para generar tu descuento para Papá.</p>
        </div>

        <div id="success-area" class="hidden">
            <h1 style="color: #1e3a8a; margin: 10px 0;">¡Felicidades Papá!</h1>
            <p style="font-size: 0.95rem; color: #475569;">Toma captura de este código para tu <b>10% de descuento</b>.</p>
            <div id="id-unico" class="code-box">---</div>

            <a id="wa-btn" href="#" target="_blank" class="btn-whatsapp">
                RESERVAR POR WHATSAPP
            </a>
            
            <p style="font-size: 0.8rem; color: #64748b; margin-top: 20px;">Validado en: <br><span id="direccion-text" style="font-weight: bold; color: #334155;">Obteniendo ubicación...</span></p>
        </div>

        <img src="ROAD NEGRO (1).png" alt="OnRoad Analytics" class="logo-onroad">
    </div>

    <script>
        const GEOAPIFY_KEY = "73282b6f42214899a14ad7ad5421244d"; 
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyBXqLfgn7YV-Ytt99wg8XSlMT0sR-g7ZSIJZHBWhQHYEuvlzefABoNdEbj4nQEgeSJTg/exec";
        const PHONE = "522712076727";

        function generarID() {
            return 'PAPA-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        }

        function procesar() {
            // Pasamos opciones al GPS para que responda instantáneamente y no se quede colgado buscando precisión extrema
            const gpsOptions = {
                enableHighAccuracy: false,
                timeout: 5000,
                maximumAge: 60000
            };

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const { latitude: lat, longitude: lon } = pos.coords;
                    const idUnico = generarID();

                    // TRUCO DE VELOCIDAD: Mostramos la pantalla de éxito YA de inmediato
                    const texto = `Hola vi tu publicidad en Onroad y me interesa asistir al evento para celebrar a PAPÁ y conseguir un 10% de descuento con mi código: ${idUnico}`;
                    const finalLink = `https://wa.me/${PHONE}?text=${encodeURIComponent(texto)}`;

                    document.getElementById('loading-area').classList.add('hidden');
                    document.getElementById('success-area').classList.remove('hidden');
                    document.getElementById('id-unico').innerText = idUnico;
                    document.getElementById('wa-btn').href = finalLink;

                    // El proceso pesado de traducir la dirección y enviar a Google Sheets ocurre en segundo plano
                    try {
                        const geoRes = await fetch(`https://api.geoapify.com/v1/geocode/reverse?lat=${lat}&lon=${lon}&apiKey=${GEOAPIFY_KEY}`);
                        const geoData = await geoRes.json();
                        const direccion = geoData.features[0].properties.formatted || "Dirección no disponible";
                        
                        document.getElementById('direccion-text').innerText = direccion;

                        // Mandamos datos a la tabla en el fondo
                        const formData = new FormData();
                        formData.append('idUnico', idUnico);
                        formData.append('lat', lat);
                        formData.append('lon', lon);
                        formData.append('direccion', direccion);

                        fetch(WEB_APP_URL, { method: 'POST', body: formData });

                    } catch (e) {
                        // Si falla Geoapify por red, igual guardamos coordenadas básicas
                        document.getElementById('direccion-text').innerText = `Coordenadas: ${lat}, ${lon}`;
                        const formData = new FormData();
                        formData.append('idUnico', idUnico);
                        formData.append('lat', lat);
                        formData.append('lon', lon);
                        formData.append('direccion', `Lat: ${lat}, Lon: ${lon}`);
                        fetch(WEB_APP_URL, { method: 'POST', body: formData });
                    }
                }, (error) => {
                    // Si deniegan el permiso o da timeout
                    document.getElementById('status').innerHTML = "<span style='color:#dc2626; font-weight:bold;'>⚠️ Activa el GPS para validar el beneficio.</span>";
                }, gpsOptions);
            } else {
                document.getElementById('status').innerText = "Tu navegador no soporta geolocalización.";
            }
        }
        window.onload = procesar;
    </script>
</body>
</html>
